# Netlify configuration for the Prayatn website.
# The site is plain HTML — there is nothing to build, so Netlify just publishes
# the files in this folder exactly as they are.

[build]
  publish = "."
  command = ""

# Let visitors reach pages without typing ".html"
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/education"
  to = "/education.html"
  status = 301

[[redirects]]
  from = "/health"
  to = "/healthcare.html"
  status = 301

[[redirects]]
  from = "/healthcare"
  to = "/healthcare.html"
  status = 301

# the old site had this misspelling in its own menu
[[redirects]]
  from = "/women-develoment"
  to = "/women-development.html"
  status = 301

[[redirects]]
  from = "/women-development"
  to = "/women-development.html"
  status = 301

[[redirects]]
  from = "/board-details"
  to = "/trustees.html"
  status = 301

[[redirects]]
  from = "/trustees"
  to = "/trustees.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/contact.php"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/get-involved"
  to = "/get-involved.html"
  status = 301

# Anything else that no longer exists lands on the friendly 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
